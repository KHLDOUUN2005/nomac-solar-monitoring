version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-nomac_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-engine:
    build: ./ai-engine
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  backend:
    build: ./backend/Monitoring
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-nomac_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres
      - ai-engine

  frontend:
    build: ./frontend/nomac-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: